[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.7"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://gitlab.com/agentx.rs/visor"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_for_each = { level = "allow", priority = 1 } # utoipa OpenApi derive macro generates for_each

[workspace.dependencies]
# VMM (rust-vmm)
event-manager = "0.4"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.24"
libc = "0.2"
linux-loader = "0.13"
seccompiler = "0.5"
virtio-bindings = "0.2"
virtio-queue = "0.17"
vm-memory = "0.17"
vm-superio = "0.8"
vmm-sys-util = "0.15"

# macOS hypervisor
applevisor = { version = "1.0", default-features = false, features = ["macos-15-0"] }

# Sandboxing
nono = "0.7"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# Async / HTTP
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1.49", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }

# Serialization
bincode = "2.0"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio-tungstenite = { version = "0.28", features = ["connect"] }
toml = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# TUI
crossterm = "0.29"
ratatui = "0.30"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Linux
nix = { version = "0.31", features = ["fs", "mount", "sched", "process", "signal", "ioctl", "net", "user", "term"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Identifiers
uuid = { version = "1.21", features = ["v4"] }

# Encoding
base64 = "0.22"

# OCI
flate2 = "1.1"
hex = "0.4"
ignore = "0.4.25"
oci-distribution = "0.11"
oci-spec = { version = "0.9", features = ["image"] }
parse-dockerfile = { version = "0.1", default-features = false }
sha2 = "0.10"
tar = "0.4"

# Time
time = { version = "0.3.47", features = ["formatting", "macros"] }

# OpenAPI
utoipa = { version = "5.4", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# DNS
hickory-server = { version = "0.25", features = ["resolver"] }
tokio-util = "0.7"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Device Tree
vm-fdt = "0.3.0"
vmnet = "0.5"

# Testing
acpi_tables = "0.2.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serial_test = "3.4.0"
tempfile = "3.26"

# ── Root package (integration test harness only) ─────────────────

[package]
name = "visor-integration-tests"
version.workspace = true
edition.workspace = true
publish = false

# No library or binary targets — only integration tests in tests/.
autobenches = false
autobins = false
autoexamples = false
autolib = false

[lints]
workspace = true

[dev-dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
kvm-bindings = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
visor-build = { path = "crates/visor-build" }
visor-docker = { path = "crates/visor-docker" }
visor-runtime = { path = "crates/visor-runtime" }
visor-vmm = { path = "crates/visor-vmm" }
